<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>VCC</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, "SF Pro Text", "Segoe UI Variable Display", "Segoe UI", "Microsoft YaHei UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  :root {
    --text: #f5f5f7;
    --text-dim: rgba(255, 255, 255, 0.72);
    --text-faint: rgba(255, 255, 255, 0.38);
  }
  #card {
    margin: 10px 12px 8px;
    padding: 20px 22px 16px;
    border-radius: 14px;
    position: relative;
    background: linear-gradient(180deg, rgba(27, 27, 31, 0.9), rgba(12, 12, 15, 0.95));
    backdrop-filter: blur(32px) saturate(1.5);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 20px 56px rgba(0, 0, 0, 0.5), 0 2px 10px rgba(0, 0, 0, 0.3);
    opacity: 0;
    transform: translateY(10px) scale(0.97);
    transition: opacity 0.34s cubic-bezier(0.32, 0.72, 0, 1),
                transform 0.34s cubic-bezier(0.32, 0.72, 0, 1);
  }
  #card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(168deg,
      rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0.08) 40%, rgba(255, 255, 255, 0.02));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  #card.in { opacity: 1; transform: none; }
  #title {
    font-size: 15px;
    font-weight: 650;
    letter-spacing: 0.02em;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #title::before {
    content: "⚡";
    font-size: 12px;
    filter: grayscale(1) brightness(1.6);
    opacity: 0.9;
  }
  #body {
    margin-top: 10px;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--text-dim);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 300px;
    overflow-y: auto;
    user-select: text;
  }
  #body::-webkit-scrollbar { width: 5px; }
  #body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 3px; }
  #btns {
    margin-top: 18px;
    display: flex;
    justify-content: flex-end;
    gap: 9px;
    flex-wrap: wrap;
  }
  #btns button {
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 550;
    letter-spacing: 0.02em;
    padding: 7px 18px;
    border-radius: 8px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: filter 0.15s, transform 0.1s, background 0.15s;
  }
  #btns button:active { transform: scale(0.96); }
  #btns button.normal {
    background: rgba(255, 255, 255, 0.09);
    border-color: rgba(255, 255, 255, 0.14);
    color: var(--text);
  }
  #btns button.normal:hover { background: rgba(255, 255, 255, 0.15); }
  #btns button.primary {
    background: rgba(255, 255, 255, 0.92);
    color: #0d0d10;
  }
  #btns button.primary:hover { filter: brightness(1.06); }
  #btns button.danger {
    background: linear-gradient(180deg, #ff5f52, #e0342a);
    color: #fff;
    border-color: rgba(255, 120, 110, 0.4);
  }
  #btns button.danger:hover { filter: brightness(1.08); }
  #hint {
    margin: 0 12px 6px;
    text-align: center;
    font-size: 10.5px;
    letter-spacing: 0.04em;
    color: rgba(255, 255, 255, 0.32);
  }
</style>
</head>
<body>
  <div id="card">
    <div id="title">提示</div>
    <div id="body"></div>
    <div id="btns"></div>
  </div>
  <div id="hint">按 Esc 关闭</div>
<script>
const TAURI = window.__TAURI__;
const T = TAURI ? {
  invoke: TAURI.core.invoke,
  emit: TAURI.event.emit,
  listen: TAURI.event.listen,
  win: () => TAURI.window.getCurrentWindow(),
  LogicalSize: TAURI.dpi.LogicalSize,
} : null;

function finish(label) {
  if (T) { try { T.emit("vcc://dialog-result", { label }); } catch (e) {} }
  // 后端收到结果会 destroy 窗口；这里尝试自关（无权限时静默失败）
  setTimeout(() => { try { T && T.win().close(); } catch (e) {} }, 80);
}

function render(p) {
  document.getElementById("title").textContent = p.title || "提示";
  document.getElementById("body").textContent = p.body || "";
  const bs = Array.isArray(p.buttons) && p.buttons.length ? p.buttons : [{ label: "好", style: "primary" }];
  const wrap = document.getElementById("btns");
  wrap.innerHTML = "";
  bs.forEach((b) => {
    const el = document.createElement("button");
    el.className = ["normal", "primary", "danger"].includes(b.style) ? b.style : "normal";
    el.textContent = b.label || "确定";
    el.onclick = () => finish(b.label || "确定");
    wrap.appendChild(el);
  });
  requestAnimationFrame(() => {
    document.getElementById("card").classList.add("in");
    fit();
  });
}

// 内容实际高度与窗口不符时自适应（后端只是估算）
function fit() {
  if (!T || !T.LogicalSize) return;
  const h = document.documentElement.scrollHeight;
  const cur = window.innerHeight;
  if (h > cur + 4 || cur - h > 36) {
    const target = Math.min(Math.max(h + 22, 200), 640);
    try { T.win().setSize(new T.LogicalSize(380, target)); } catch (e) {}
  }
}

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") finish("__closed__");
});

(async () => {
  if (!T) { render({ title: "演示", body: "Tauri 未注入（单独打开页面）" }); return; }
  await T.listen("vcc://dialog-set", (ev) => render(ev.payload));
  T.invoke("dialog_ready"); // 就绪信号 → 后端补发 payload（防 emit 竞态）
  // 兜底：若 600ms 后仍为空再要一次
  setTimeout(() => {
    if (!document.getElementById("body").textContent && !document.getElementById("btns").children.length) {
      T.invoke("dialog_ready");
    }
  }, 600);
})();
</script>
</body>
</html>
