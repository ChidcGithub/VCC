<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>VCC Overlay</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
    }
    /* 小布 Next 长按波形条带：底部全宽 × 160px（≈手机 52dp 视图 @2.75x）
       显隐透明度由着色器内 COE 动画轨驱动（FadeIn 624ms / FadeOut 464ms），
       CSS 只负责 COUI 面板 Fragment 的底部生长滑入（350ms emphasized-decel） */
    #gl {
      position: fixed; left: 0; bottom: 0;
      width: 100vw; height: 160px;
      display: block;
      transform: translateY(14px);
      transition: transform 0.35s cubic-bezier(0.05, 0.7, 0.1, 1);
      will-change: transform;
    }
    #gl.on { transform: translateY(0); }
    /* WebGL 完全不可用时的兜底呼吸条（正常不出现；保证课堂场景必有反馈） */
    body.no-webgl #gl { display: none; }
    body.no-webgl::after {
      content: ''; position: fixed; left: 6vw; right: 6vw; bottom: 18px; height: 84px;
      border-radius: 28px;
      background: linear-gradient(90deg, rgba(64,150,238,.55), rgba(88,200,140,.5), rgba(196,120,220,.5), rgba(240,150,80,.55));
      filter: blur(14px);
      animation: vccbreath 1.27s cubic-bezier(0.33, 0, 0.67, 1) infinite;
    }
    @keyframes vccbreath {
      0%, 100% { opacity: .22; transform: translateY(12px) scaleX(.985); }
      50% { opacity: .5; transform: translateY(0) scaleX(1); }
    }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <script src="overlay.js"></script>
</body>
</html>
