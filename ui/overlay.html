<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>VCC Overlay</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
    }
    /* 小布 Next 长按波形条带：底部全宽 × 160px（≈手机 52dp 视图 @2.75x）
       显隐透明度由着色器内 COE 动画轨驱动（FadeIn 624ms / FadeOut 464ms），
       CSS 只负责 COUI 面板 Fragment 的底部生长滑入（350ms emphasized-decel） */
    #gl {
      position: fixed; left: 0; bottom: 0;
      width: 100vw; height: 160px;
      display: block;
      transform: translateY(14px);
      transition: transform 0.35s cubic-bezier(0.05, 0.7, 0.1, 1);
      will-change: transform;
    }
    #gl.on { transform: translateY(0); }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <script src="overlay.js"></script>
</body>
</html>
