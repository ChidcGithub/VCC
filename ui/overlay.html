<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>VCC Overlay</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
    }
    #gl {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;
      display: block;
      opacity: 0;
      transform: scale(1.015);
      transition: opacity 0.75s cubic-bezier(0.32, 0.72, 0, 1),
                  transform 1.15s cubic-bezier(0.32, 0.72, 0, 1);
    }
    #gl.on { opacity: 1; transform: scale(1); }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <script src="overlay.js"></script>
</body>
</html>
