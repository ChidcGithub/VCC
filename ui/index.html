<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VCC</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="idle">
  <main class="card">
    <header data-tauri-drag-region>
      <div class="brand" data-tauri-drag-region>
        <span class="pulse-dot"></span>
        <span class="brand-name">VCC</span>
      </div>
      <div class="hint" data-tauri-drag-region>Ctrl+Shift+Space 呼出</div>
      <div class="header-actions">
        <button class="ghost-btn" id="btn-new" title="新对话">⟳</button>
        <button class="ghost-btn" id="btn-settings" title="设置">⚙</button>
      </div>
    </header>

    <section id="chat" aria-live="polite">
      <div id="empty-state" class="hidden">
        <div class="es-logo">⚡</div>
        <div class="es-title">你好，我是 VCC</div>
        <div class="es-sub">语音或文字，一句话操控这台电脑</div>
        <div class="es-chips">
          <button class="chip" data-cmd="打开记事本">打开记事本</button>
          <button class="chip" data-cmd="音量调到 50">音量调到 50</button>
          <button class="chip" data-cmd="打开计算器">打开计算器</button>
          <button class="chip" data-cmd="静音">一键静音</button>
        </div>
      </div>
    </section>

    <div id="live-transcript" class="hidden"></div>
    <div id="phase-line" class="empty"></div>

    <footer>
      <div class="glow-under" aria-hidden="true"></div>
      <button id="btn-mic" title="按住说话">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <rect x="9" y="3" width="6" height="11" rx="3"/>
          <path d="M5 11a7 7 0 0 0 14 0"/>
          <line x1="12" y1="18" x2="12" y2="21"/>
        </svg>
      </button>
      <input id="input" type="text" placeholder="说点什么，或输入指令…" autocomplete="off" />
      <button id="btn-send" title="发送">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5"/>
          <path d="M5 12l7-7 7 7"/>
        </svg>
      </button>
    </footer>

    <!-- 设置面板 -->
    <div id="settings" class="settings hidden">
      <div class="settings-head">
        <span>设置</span>
        <button class="ghost-btn" id="btn-close-settings">✕</button>
      </div>
      <div class="group-title first">连接</div>
      <label>DeepSeek API Key
        <input id="cfg-key" type="password" placeholder="sk-…" />
      </label>
      <label>Base URL
        <input id="cfg-url" type="text" placeholder="https://api.deepseek.com" />
      </label>
      <label>模型
        <input id="cfg-model" type="text" placeholder="deepseek-chat" />
      </label>
      <div class="group-title">通用</div>
      <label>全局热键（保存后立即生效）
        <input id="cfg-hotkey" type="text" placeholder="Ctrl+Shift+Space" />
      </label>
      <div class="group-title">语音识别</div>
      <label>语音识别模型（学校低配设备建议「快」）
        <select id="cfg-vm" class="cfg-select">
          <option value="fast">快 · q5 量化（推荐）</option>
          <option value="quality">准 · fp16 原版</option>
        </select>
      </label>
      <div id="voice-status" class="voice-status"></div>
      <label>识别语言
        <select id="cfg-vlang" class="cfg-select">
          <option value="zh">中文（普通话）</option>
          <option value="en">English</option>
          <option value="auto">自动检测（略慢）</option>
        </select>
      </label>
      <label>快捷指令（一行一条，空态展示；留空用默认）
        <textarea id="cfg-cmds" rows="3" spellcheck="false"
          placeholder="打开投影仪&#10;打开班级优化大师"></textarea>
      </label>
      <label class="cfg-check">
        <input id="cfg-tts" type="checkbox" />
        <span>朗读 AI 回答（投影课堂）</span>
      </label>
      <label class="cfg-check">
        <input id="cfg-autostart" type="checkbox" />
        <span>开机自启</span>
      </label>
      <label class="cfg-check">
        <input id="cfg-topmost" type="checkbox" />
        <span>窗口置顶（演示模式）</span>
      </label>
      <div class="group-title">记忆</div>
      <div class="mem-head">
        <span>AI 长期记忆 · 自动积累</span>
        <button class="mini-link" id="btn-clear-memory">清除</button>
      </div>
      <textarea id="cfg-memory" rows="4" spellcheck="false"
        placeholder="AI 会自动在这里积累对你的了解（跨会话生效），也可手动编辑…"></textarea>
      <div class="settings-foot">
        <span id="settings-status"></span>
        <span id="ver-text" class="ver-line"></span>
        <button id="btn-save-settings">保存</button>
      </div>
    </div>
  </main>

  <script src="main.js"></script>
</body>
</html>
