<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VCC</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dark idle">
  <div class="app">
    <!-- ============ 侧边栏（对标 chat.deepseek.com） ============ -->
    <aside class="sidebar" id="sidebar">
      <div class="sb-head" data-tauri-drag-region>
        <div class="brand" data-tauri-drag-region>
          <span class="pulse-dot"></span>
          <span class="brand-name">VCC</span>
        </div>
        <button class="icon-btn" id="btn-collapse" title="收起侧栏">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="3"/><line x1="9.5" y1="4" x2="9.5" y2="20"/>
          </svg>
        </button>
      </div>

      <button class="new-chat" id="btn-new">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        <span>开启新对话</span>
      </button>

      <nav class="session-list" id="session-list" aria-label="会话列表"></nav>

      <div class="sb-foot">
        <button class="foot-item" id="btn-theme" title="切换深浅主题">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>
          </svg>
          <span id="theme-label">浅色模式</span>
        </button>
        <button class="foot-item" id="btn-settings">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/>
          </svg>
          <span>设置</span>
        </button>
      </div>
    </aside>

    <div class="sb-backdrop hidden" id="sb-backdrop"></div>

    <!-- ============ 主区 ============ -->
    <main class="main">
      <header class="topbar" data-tauri-drag-region>
        <button class="icon-btn expand-btn" id="btn-expand" title="展开侧栏">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/>
          </svg>
        </button>
        <div class="topbar-title" id="topbar-title" data-tauri-drag-region>VCC</div>
        <div class="hint" data-tauri-drag-region>Ctrl+Shift+Space 呼出 · Esc 隐藏</div>
      </header>

      <section class="chat-scroll" id="chat-scroll">
        <div class="chat-col" id="chat" aria-live="polite">
          <div id="empty-state" class="empty-state hidden">
            <div class="es-logo">
              <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13 2 4.9 12.5a.6.6 0 0 0 .47.97H11l-1 8.53L18.9 11.5a.6.6 0 0 0-.47-.97H13z"/>
              </svg>
            </div>
            <div class="es-title">你好，我是 VCC</div>
            <div class="es-sub">随时开始吧 —— 语音或文字，一句话操控这台电脑</div>
            <div class="es-chips">
              <button class="chip" data-cmd="打开记事本">打开记事本</button>
              <button class="chip" data-cmd="音量调到 50">音量调到 50</button>
              <button class="chip" data-cmd="打开计算器">打开计算器</button>
              <button class="chip" data-cmd="静音">一键静音</button>
            </div>
          </div>
        </div>
      </section>

      <div id="live-transcript" class="hidden"></div>
      <div id="phase-line" class="phase-line empty"></div>

      <div class="input-area">
        <div class="input-pill" id="input-pill">
          <textarea id="input" rows="1" placeholder="给 VCC 发送消息，或按住麦克风说话"
            autocomplete="off" spellcheck="false"></textarea>
          <div class="input-tools">
            <button class="tool-btn" id="btn-mic" title="按住说话">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <rect x="9" y="3" width="6" height="11" rx="3"/>
                <path d="M5 11a7 7 0 0 0 14 0"/>
                <line x1="12" y1="18" x2="12" y2="21"/>
              </svg>
            </button>
            <span class="input-hint">Enter 发送 · Shift+Enter 换行</span>
            <button class="tool-btn send" id="btn-send" title="发送">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 19V5"/>
                <path d="M5 12l7-7 7 7"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="disclaimer">VCC 由 AI 驱动，执行系统操作前请留意确认。</div>
      </div>
    </main>
  </div>

  <!-- 会话右键/⋯ 菜单 -->
  <div id="session-menu" class="session-menu hidden">
    <button class="menu-item" id="menu-rename">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>
      </svg>
      重命名
    </button>
    <button class="menu-item danger" id="menu-delete">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
      </svg>
      删除
    </button>
  </div>

  <!-- 设置面板 -->
  <div id="settings" class="settings hidden">
    <div class="settings-head">
      <span>设置</span>
      <button class="icon-btn" id="btn-close-settings">✕</button>
    </div>
    <div class="group-title first">外观</div>
    <label>主题
      <select id="cfg-theme" class="cfg-select">
        <option value="dark">深色</option>
        <option value="light">浅色</option>
      </select>
    </label>
    <div class="group-title">连接</div>
    <label>DeepSeek API Key
      <input id="cfg-key" type="password" placeholder="sk-…" />
    </label>
    <label>Base URL
      <input id="cfg-url" type="text" placeholder="https://api.deepseek.com" />
    </label>
    <label>模型
      <input id="cfg-model" type="text" placeholder="deepseek-chat" />
    </label>
    <div class="group-title">通用</div>
    <label>全局热键（保存后立即生效）
      <input id="cfg-hotkey" type="text" placeholder="Ctrl+Shift+Space" />
    </label>
    <div class="group-title">语音识别</div>
    <label>语音识别模型（学校低配设备建议「快」）
      <select id="cfg-vm" class="cfg-select">
        <option value="fast">快 · q5 量化（推荐）</option>
        <option value="quality">准 · fp16 原版</option>
      </select>
    </label>
    <div id="voice-status" class="voice-status"></div>
    <label>识别语言
      <select id="cfg-vlang" class="cfg-select">
        <option value="zh">中文（普通话）</option>
        <option value="en">English</option>
        <option value="auto">自动检测（略慢）</option>
      </select>
    </label>
    <label>快捷指令（一行一条，空态展示；留空用默认）
      <textarea id="cfg-cmds" rows="3" spellcheck="false"
        placeholder="打开投影仪&#10;打开班级优化大师"></textarea>
    </label>
    <label class="cfg-check">
      <input id="cfg-tts" type="checkbox" />
      <span>朗读 AI 回答（投影课堂）</span>
    </label>
    <label class="cfg-check">
      <input id="cfg-autostart" type="checkbox" />
      <span>开机自启</span>
    </label>
    <label class="cfg-check">
      <input id="cfg-topmost" type="checkbox" />
      <span>窗口置顶（演示模式）</span>
    </label>
    <div class="group-title">记忆</div>
    <div class="mem-head">
      <span>AI 长期记忆 · 自动积累</span>
      <button class="mini-link" id="btn-clear-memory">清除</button>
    </div>
    <textarea id="cfg-memory" rows="4" spellcheck="false"
      placeholder="AI 会自动在这里积累对你的了解（跨会话生效），也可手动编辑…"></textarea>
    <div class="settings-foot">
      <span id="settings-status"></span>
      <span id="ver-text" class="ver-line"></span>
      <button id="btn-save-settings">保存</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
